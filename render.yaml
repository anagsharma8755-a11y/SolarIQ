# SolarIQ — Render Blueprint
#
# Deploy both services with:
#   render blueprints apply
#
# Or deploy individually via the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ──────────────────────────────────────────────
  # Backend — FastAPI (Docker-based)
  # ──────────────────────────────────────────────
  - name: solariq-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SOLARIQ_ENV
        value: production
      - key: SOLARIQ_HOST
        value: 0.0.0.0
      - key: SOLARIQ_LOG_LEVEL
        value: INFO
      - key: SOLARIQ_DATABASE_URL
        value: sqlite:///data/solariq.db
      - key: SOLARIQ_CORS_ORIGINS
        sync: false
      - key: SOLARIQ_DATA_DIR
        value: data
      - key: SOLARIQ_PROCESSED_DATA_DIR
        value: data/processed
      - key: SOLARIQ_MODEL_DIR
        value: models
    healthCheckPath: /health
    autoDeployTrigger: commit

  # ──────────────────────────────────────────────
  # Frontend — Static Site
  # ──────────────────────────────────────────────
  - name: solariq-frontend
    type: web
    runtime: static
    staticPublishPath: ./frontend/dist
    buildCommand: cd frontend && npm install && npm run build
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
